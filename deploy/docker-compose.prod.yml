# TalentCloud AI en un solo servidor (VPS de 4 GB). Se ejecuta desde esta carpeta:
#
#   cp .env.example .env        # y completar los valores
#   docker compose -f docker-compose.prod.yml up -d
#
# Solo Caddy publica puertos (80 y 443). La base y el servicio de IA quedan en la red interna.
# Los límites de memoria evitan que un servicio deje sin memoria a los demás: si uno se pasa, Docker lo reinicia.
name: talentcloud-prod

x-laravel: &laravel
  image: ${IMAGEN_PREFIJO:-talentcloud}/app:${IMAGEN_ETIQUETA:-local}
  build:
    context: ../talentcloud
    target: app
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Ajustes para ~700 MB: la base completa de la demostración pesa menos de 50 MB.
    command: >
      postgres
      -c shared_buffers=192MB
      -c effective_cache_size=512MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      retries: 10
    mem_limit: 700m

  ia:
    image: ${IMAGEN_PREFIJO:-talentcloud}/ia:${IMAGEN_ETIQUETA:-local}
    build:
      context: ../talentcloud-ai
    environment:
      TALENTCLOUD_AI_API_KEY: ${IA_API_KEY}
    restart: unless-stopped
    # El modelo ocupa ~1,2 GB en reposo y algo más mientras analiza un CV.
    mem_limit: 1900m

  app:
    <<: *laravel
    depends_on:
      db:
        condition: service_healthy
      ia:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      retries: 10
      start_period: 20s
    mem_limit: 500m

  # Procesa los CV, el matching y los avisos (colas "ia" y "default").
  queue:
    <<: *laravel
    command: php artisan queue:work --queue=ia,default --sleep=3 --max-time=3600 --memory=200
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 300m

  # Ejecuta las tareas programadas (limpiezas diarias).
  scheduler:
    <<: *laravel
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 200m

  web:
    image: ${IMAGEN_PREFIJO:-talentcloud}/web:${IMAGEN_ETIQUETA:-local}
    build:
      context: ../talentcloud
      target: web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${PUERTO_HTTP:-80}:80"
      - "${PUERTO_HTTPS:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 100m

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
