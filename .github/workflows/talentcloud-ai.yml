name: talentcloud-ai

on:
  push:
    paths: ['talentcloud-ai/**', '.github/workflows/talentcloud-ai.yml']
  pull_request:
    paths: ['talentcloud-ai/**', '.github/workflows/talentcloud-ai.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talentcloud-ai

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Dependencias (según uv.lock)
        run: uv sync --locked

      - name: Estilo
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tipos
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov --cov-report=term

  imagen:
    # La imagen de Cloud Run debe poder construirse (con el modelo incluido) antes de desplegar.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen (sin publicarla)
        uses: docker/build-push-action@v6
        with:
          context: talentcloud-ai
          push: false
          tags: talentcloud-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
