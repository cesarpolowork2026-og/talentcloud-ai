name: despliegue

# Manual: se lanza desde la pestaña Actions ("Run workflow"). Construye las dos imágenes en GitHub
# (el servidor pequeño no debe compilar el frontend) y las publica en ghcr.io.
# Con "desplegar" marcado, además actualiza el servidor por SSH.
on:
  workflow_dispatch:
    inputs:
      desplegar:
        description: 'Actualizar también el servidor (requiere los secretos SERVIDOR_*)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  imagenes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: app, contexto: talentcloud, target: app }
          - { nombre: web, contexto: talentcloud, target: web }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.nombre }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.nombre }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}

  desplegar:
    if: ${{ inputs.desplegar }}
    needs: imagenes
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar el servidor
        env:
          SERVIDOR_HOST: ${{ secrets.SERVIDOR_HOST }}
          SERVIDOR_USUARIO: ${{ secrets.SERVIDOR_USUARIO }}
          SERVIDOR_CLAVE_SSH: ${{ secrets.SERVIDOR_CLAVE_SSH }}
          SERVIDOR_HUELLA: ${{ secrets.SERVIDOR_HUELLA }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVIDOR_CLAVE_SSH" > ~/.ssh/id_despliegue
          chmod 600 ~/.ssh/id_despliegue
          # La huella del servidor se guarda como secreto (salida de `ssh-keyscan -t ed25519 <ip>`):
          # así se comprueba que es el servidor de siempre y no otro.
          printf '%s\n' "$SERVIDOR_HUELLA" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_despliegue "$SERVIDOR_USUARIO@$SERVIDOR_HOST" 'bash -s' <<'REMOTO'
          set -eu
          cd ~/talentcloud/deploy
          git pull --ff-only
          docker compose -f docker-compose.prod.yml pull
          # Migraciones con el código nuevo antes de reemplazar los contenedores.
          docker compose -f docker-compose.prod.yml run --rm app php artisan migrate --force
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          REMOTO
