<!DOCTYPE html>
<!--
    Imagen para compartir (Open Graph, 1200 × 630): public/marca/vista-previa.png.
    Regenerar: abrir este archivo con un navegador a 1200 × 630 y capturar la página
    (por ejemplo, con Playwright: page.goto('file:///…/vista-previa.html') + page.screenshot).
    Sin datos reales: el ejemplo es el mismo, ficticio, de «Cómo funciona».
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
    @font-face { font-family: 'Source Serif 4'; font-weight: 400; src: url('../../../node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Source Serif 4'; font-weight: 600; src: url('../../../node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Source Serif 4'; font-weight: 700; src: url('../../../node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-700-normal.woff2') format('woff2'); }
    * { box-sizing: border-box; margin: 0; }
    body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Source Serif 4', Georgia, serif; background: #004961; color: #fff; }
    .lienzo { position: relative; height: 100%; padding: 64px 72px; display: grid; grid-template-columns: 1.05fr 1fr; gap: 56px; align-items: center; }
    .logo { height: 64px; display: block; margin-bottom: 40px; }
    h1 { font-size: 58px; line-height: 1.08; font-weight: 700; letter-spacing: -0.01em; }
    .lema { margin-top: 22px; font-size: 26px; line-height: 1.4; color: #cbeeff; }
    .dominio { position: absolute; left: 72px; bottom: 44px; font-size: 20px; color: #99e0ff; letter-spacing: 0.04em; }
    .tarjeta { background: #fff; color: #201e1d; border-radius: 6px; padding: 26px 28px; box-shadow: 0 18px 40px rgba(0, 0, 0, .25); }
    .tarjeta + .tarjeta { margin-top: 18px; }
    .rotulo { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: #006786; }
    .cita { margin-top: 12px; font-size: 22px; line-height: 1.5; }
    .cita mark { background: #cbeeff; color: inherit; padding: 0 3px; }
    .fila { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .req { font-size: 28px; font-weight: 600; }
    .tag { font-size: 16px; color: #006786; background: #e9f8ff; padding: 4px 12px; border-radius: 2px; }
    .barra { margin-top: 14px; height: 8px; border-radius: 4px; background: #eae7e7; }
    .barra span { display: block; width: 100%; height: 100%; border-radius: 4px; background: #1186ac; }
</style>
</head>
<body>
<div class="lienzo">
    <div>
        <img class="logo" src="../../../public/marca/talentcloud-ai-oscuro.svg" alt="">
        <h1>Reclutamiento y selección en un solo flujo</h1>
        <p class="lema">Vacantes, candidatos, entrevistas y evaluaciones. Tú decides.</p>
    </div>
    <div>
        <div class="tarjeta">
            <p class="rotulo">CV · Experiencia</p>
            <p class="cita">«<mark>Diseñé APIs REST con Java y Spring Boot</mark> para una pasarela de pagos.»</p>
        </div>
        <div class="tarjeta">
            <p class="rotulo">Requisito obligatorio</p>
            <div class="fila"><span class="req">Spring Boot</span><span class="tag">Aparece en el CV</span></div>
            <div class="barra"><span></span></div>
        </div>
    </div>
    <p class="dominio">Empieza gratis · Planes en soles</p>
</div>
</body>
</html>
