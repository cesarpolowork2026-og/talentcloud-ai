; Ajustes de PHP para producción en un servidor pequeño.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 10M
max_execution_time = 60

; Los archivos de la imagen no cambian mientras corre: no hace falta revisar fechas.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
