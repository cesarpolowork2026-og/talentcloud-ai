[www]
; clear_env = no: sin esto PHP-FPM descarta las variables de entorno y Laravel no recibiría su configuración.
clear_env = no

; Pocos procesos: cada uno ocupa unos 50 MB y el servidor comparte memoria con la base y la IA.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
