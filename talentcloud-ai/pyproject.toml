[project]
name = "talentcloud-ai"
version = "0.1.0"
description = "Servicio de IA de TalentCloud: extracción de información de CVs y matching explicable."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.34",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talentcloud_ai"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT", "C4", "PL"]
ignore = [
    "PLR2004", # los umbrales con nombre viven en matching/umbrales.py; en tests los números son la expectativa
    "RUF001",  # el texto es español con guiones largos (—, –) intencionados
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR0917"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["talentcloud_ai"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Además del paquete instalado: en Windows, Python 3.11 lee los .pth con la página de códigos ANSI
# y una ruta con tildes ("Décimo") rompe la instalación editable.
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["talentcloud_ai"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
